name: Nava
description: 'Nava (Nava Benefits) is a modern employee benefits brokerage that pairs
  benefits advisors with AI-powered technology to cut administrative work, simplify
  renewals, and support employees around the clock. Its HQ platform helps HR teams
  manage benefits and renewals while an employee app acts as a 24/7 digital benefits
  concierge for workers and their families, integrating with BenAdmin and carrier
  systems. Backed by Homebrew, Nava positions itself as an alternative to traditional
  brokers focused on cost savings and administrative relief. No public developer program,
  API, or OpenAPI surface is published as of this enrichment pass.'
